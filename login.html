<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SocialReport — Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
  <main class="auth-card">
    <div class="brand">
      <div class="brand-mark">SR</div>
      <div>
        <strong>SocialReport</strong>
        <small>Content Reporting System</small>
      </div>
    </div>
    <h1>Masuk ke Sistem</h1>
    <p class="muted">Kelola report konten dan akun media sosial secara terstruktur.</p>
    <form id="loginForm">
      <label>Username / Email</label>
      <input id="username" type="text" placeholder="Masukkan username atau email" required>
      <label>Password</label>
      <input id="password" type="password" placeholder="Masukkan password" required>
      <button class="btn primary full" type="submit">Masuk</button>
    </form>
    <div class="demo-note">
      <b>Demo credentials</b><br>
      User: <code>user</code> / <code>password123</code><br>
      Admin: <code>admin</code> / <code>password123_</code>
    </div>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
